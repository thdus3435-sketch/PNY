<body>
  <div class="page">
    <div class="title" id="pageTitle">고객지원사업</div>

    <div class="tabs">
      <div class="tab active" onclick="goList()">신규 고객지원사업</div>
      <div class="tab" onclick="goList()">고객지원사업 관리</div>
    </div>

    <div id="app" class="loading">불러오는 중...</div>
  </div>

  <script>
    const NOTICE_ID = "<?= noticeId ?>";
    const WEB_APP_URL = "<?= webAppUrl ?>";
    const PAGE_SIZE = 10;

    let regularCardsAll = [];
    let regularPage = 1;
    const REGULAR_PAGE_SIZE = 5;
    
    let CURRENT_PAGE = 1;
    let CURRENT_NOTICE_LIST = [];
    let CURRENT_SORT = "score_desc";
    let LAST_LIST_PAYLOAD = null;
    let CURRENT_DETAIL_NOTICE = null;

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeJs(text) {
      if (text === null || text === undefined) return "";

      return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll('"', '\\"')
        .replaceAll("\n", " ")
        .replaceAll("\r", " ");
    }

    function goDetail(id) {
      const noticeId = String(id || "").trim();

      if (!noticeId) {
        alert("공고ID가 없어 상세 화면으로 이동할 수 없습니다.");
        return;
      }

      document.getElementById("app").className = "loading";
      document.getElementById("app").innerHTML = "상세 정보를 불러오는 중...";

      google.script.run
        .withSuccessHandler(data => {
          if (!data) {
            document.getElementById("app").className = "";
            document.getElementById("app").innerHTML = `
              <div class="empty-box">공고를 찾을 수 없습니다.</div>
            `;
            return;
          }

          if (window.history && window.history.pushState) {
            window.history.pushState(
            {
              page: "detail",
              noticeId: noticeId
            },
            "",
            "?id=" + encodeURIComponent(noticeId)
          );
          }

          renderDetail(data);
        })
        .withFailureHandler(err => {
          renderError(err.message);
        })
        .getNoticeDetail(noticeId);
    }

    function goList() {
      document.getElementById("pageTitle").textContent = "고객지원사업";
      document.getElementById("app").className = "loading";
      document.getElementById("app").innerHTML = "불러오는 중...";

      // 상세 URL의 ?id=... 제거

    function toNumber(value) {
      const n = Number(String(value || "0").replaceAll(",", "").trim());
      return Number.isNaN(n) ? 0 : n;

    function parseDateValue(value) {
      const text = String(value || "").trim();
      const match = text.match(/(20\d{2})[-./](\d{1,2})[-./](\d{1,2})/);

      if (!match) return 0;

      const y = Number(match[1]);
      const m = Number(match[2]) - 1;
      const d = Number(match[3]);

      return new Date(y, m, d).getTime();
    }

    function sortNotices(notices) {
      const sorted = [...(notices || [])];

      sorted.sort((a, b) => {
        switch (CURRENT_SORT) {
          case "score_desc":
            return toNumber(b.적합도점수) - toNumber(a.적합도점수);

          case "score_asc":
            return toNumber(a.적합도점수) - toNumber(b.적합도점수);

          case "grade_desc":
            return gradeRank(b.적합도등급) - gradeRank(a.적합도등급);

          case "grade_asc":
            return gradeRank(a.적합도등급) - gradeRank(b.적합도등급);

          case "notice_date_asc":
            return parseDateValue(a.공고일) - parseDateValue(b.공고일);

          case "notice_date_desc":
            return parseDateValue(b.공고일) - parseDateValue(a.공고일);

          case "apply_start_asc":
            return getApplyStartDateValue(a) - getApplyStartDateValue(b);

          case "apply_start_desc":
            return getApplyStartDateValue(b) - getApplyStartDateValue(a);

          case "deadline_asc":
            return parseDateValue(a.마감일) - parseDateValue(b.마감일);

          case "deadline_desc":
            return parseDateValue(b.마감일) - parseDateValue(a.마감일);

          default:
            return toNumber(b.적합도점수) - toNumber(a.적합도점수);
        }
      });

      return sorted;
    }

    function normalizeAttachmentName(name) {
      let text = String(name || "").trim();

      if (!text) return "첨부파일";

      const lines = text
        .split(/\n|\\n/g)
        .map(v => v.trim())
        .filter(Boolean)
        .filter(v => !/^\d+$/.test(v))
        .filter(v => v !== "공고 첨부파일")
        .filter(v => v !== "첨부파일")
        .filter(v => v !== "파일 등록 일자")
        .filter(v => v !== "항목")
        .filter(v => v !== "순번");

      const fileLine = lines.find(v =>
        /\.(pdf|hwp|hwpx|zip|xlsx?|docx?|pptx?)$/i.test(v)
      );

      if (fileLine) return fileLine;

      return lines.length ? lines[lines.length - 1] : text.replace(/\n/g, " ");
    }

    function parseAttachments(raw) {
      if (!raw) return [];

      try {
        const parsed = JSON.parse(raw);

        if (Array.isArray(parsed)) {
          return parsed
            .map(item => ({
              name: normalizeAttachmentName(item.name || item.file_name || item.filename || "첨부파일"),
              url: String(item.url || item.download_url || item.href || "").trim()
            }))
            .filter(item => item.name);
        }
      } catch (e) {}

      return String(raw)
        .split(/\n/g)
        .map(v => v.trim())
        .filter(Boolean)
        .map(line => ({
          name: normalizeAttachmentName(line),
          url: ""
        }));
    }

    function getFirstAttachment(data) {
      const attachments = parseAttachments(data && data.첨부파일);

      if (!attachments.length) {
        return { name: "", url: "" };
      }

      return attachments[0];
    }

    function isNoticeDocumentAttachment(fileName) {
      const text = String(fileName || "").toLowerCase();

      if (!text) return false;

      const noticeKeywords = [
        "꽁고문",
        "공고문",
        "모집공고",
        "공고"
      ];

      return noticeKeywords.some(keyword => text.includes(keyword));
    }

    function getNoticeDocumentAttachments(rawAttachments) {
      return parseAttachments(rawAttachments)
        .filter(file => isNoticeDocumentAttachment(file.name));
    }

    function getValidNoticeDocumentAttachments(rawAttachments) {
      return getNoticeDocumentAttachments(rawAttachments)
        .filter(file => isValidAttachmentUrl(file.url));
    }

    function getNoticeDocumentAttachment(data) {
      const attachments = getNoticeDocumentAttachments(data && data.첨부파일);

      if (!attachments.length) {
        return { name: "", url: "" };
      }

      return attachments[0];
    }

    function isValidAttachmentUrl(url) {
      const cleanUrl = String(url || "").trim();
      if (!cleanUrl) return false;

      const lower = cleanUrl.toLowerCase();

      const blocked = [
        "blob:",
        "data:",
        "javascript:",
        ".js",
        ".css",
        ".map",
        ".png",
        ".jpg",
        ".jpeg",
        ".gif",
        ".svg",
        "webpack",
        "chunk",
        "runtime",
        "bundle",
        "loader",
        "crypto-js",
        "jszip",
        "react",
        "static/js",
        "static/css",
        "/assets/"
      ];

      if (blocked.some(v => lower.includes(v))) {
        return false;
      }

      const allowedExt = [
        ".pdf", ".hwp", ".hwpx", ".zip",
        ".xls", ".xlsx", ".doc", ".docx",
        ".ppt", ".pptx"
      ];

      if (allowedExt.some(ext => lower.includes(ext))) {
        return true;
      }

      const downloadTokens = [
        "download",
        "downfile",
        "filedown",
        "filedownload",
        "atchfile",
        "attachfile",
        "cmmnfile",
        "cmnfile"
      ];

      return downloadTokens.some(v => lower.includes(v));
    }



    function extractFirstUrlFromText(text) {
      const match = String(text || "").match(/https?:\/\/[^\s|]+/);
      return match ? match[0].trim() : "";
    }

    function isPdfUrl(url) {
      const cleanUrl = String(url || "").trim().toLowerCase();
      return cleanUrl.includes(".pdf") || cleanUrl.includes("pdf");

    function getPreviewTarget(data) {
      const detailUrl = String((data && data.상세링크) || "").trim();
      const noteUrl = extractFirstUrlFromText(data && data.비고);

      // 중요:
      // 첨부파일 URL은 자동 iframe 미리보기 대상에서 제외
      // 다운로드 링크가 iframe에 들어가면 상세 진입 시 자동 다운로드될 수 있음
      if (detailUrl) {
        return {
          type: "origin",
          name: "원본 공고 페이지",
          url: detailUrl
        };
      }

      if (noteUrl) {
        return {
          type: "origin",
          name: "원문 링크",
          url: noteUrl
        };
      }

      return {
        type: "none",
        name: "",
        url: ""
      };
    }

    function buildPreviewSrc(target) {

      // 첨부파일 다운로드 URL이 아니라 원본 공고 상세 페이지 URL만 iframe에 표시

    function saveAttachmentsToDrive() {
      if (!CURRENT_DETAIL_NOTICE || !CURRENT_DETAIL_NOTICE["공고ID"]) {
        alert("공고 정보가 없습니다.");
        return;
      }

      const validAttachments = getValidNoticeDocumentAttachments(CURRENT_DETAIL_NOTICE["첨부파일"]);

        alert(

        return;

      const btn = document.getElementById("driveSaveBtn");
      const originalText = btn ? btn.textContent : "";

      if (btn) {
        btn.disabled = true;
        btn.classList.add("disabled");
        btn.textContent = "Drive 저장 중...";
      }

      google.script.run
        .withSuccessHandler(function(result) {
          if (btn) {
            btn.disabled = false;
            btn.classList.remove("disabled");
            btn.textContent = originalText || "공고문 Drive 저장";
          }

          const savedFiles = result && result.savedFiles ? result.savedFiles : [];
          const failedFiles = result && result.failedFiles ? result.failedFiles : [];

          let message = "Drive 저장 완료\n\n";
          message += "저장 성공: " + savedFiles.length + "건\n";
          message += "저장 실패: " + failedFiles.length + "건";

          if (failedFiles.length) {
            message += "\n\n실패 내역:";
            failedFiles.slice(0, 5).forEach(function(file) {
              message += "\n- " + (file.name || "첨부파일") + ": " + (file.reason || "실패");
            });
          }

          alert(message);

          if (result && result.folderUrl) {
            window.open(result.folderUrl, "_blank");
          }
        })
        .withFailureHandler(function(error) {
          if (btn) {
            btn.disabled = false;
            btn.classList.remove("disabled");
            btn.textContent = originalText || "공고문 Drive 저장";
          }

          alert("Drive 저장 실패: " + error.message);
        })
        .saveNoticeAttachmentsToDrive(CURRENT_DETAIL_NOTICE["공고ID"]);
    }

                <button class="page-btn" id="prevPageBtn" onclick="changePage(-1)">이전</button>
                <span class="page-info" id="pageInfo">1 / 1</span>
                <button class="page-btn" id="nextPageBtn" onclick="changePage(1)">다음</button>
              </div>
            </div>
          </div>

          <div>
            <div class="side-card">
              <div class="section-title">오늘 업데이트 요약</div>
              <div class="summary-row"><span>신규 공고 수</span><b>${payload.total || 0}건</b></div>
              <div class="summary-row"><span>검토요청 공고</span><b>${summary.검토요청 || 0}건</b></div>
              <div class="summary-row"><span>미진행 처리</span><b>${summary.미진행 || 0}건</b></div>
              <div class="summary-row"><span>진행확정</span><b>${summary.진행확정 || 0}건</b></div>
            </div>

            <div class="side-card">
              <div class="section-title">진행상태 기준 안내</div>
              <div class="log-item">신규: 진행상태가 비어 있거나 신규로 저장된 공고</div>
              <div class="log-item">검토요청: 상세 화면에서 캘린더 등록 버튼을 클릭한 공고</div>
              <div class="log-item">미진행: 상세 화면에서 미진행 버튼을 클릭한 공고</div>
              <div class="log-item">진행확정: 상세 화면에서 진행확정 버튼을 클릭한 공고</div>
            </div>

            <div class="side-card">
              <div class="section-title">최근 진행상태 변경 로그</div>
              <div class="log-item">상세 화면에서 진행상태 변경 시 상태변경로그 시트에 기록됩니다.</div>
              <div class="log-item">진행확정 공고는 고객지원사업 관리 대상으로 연계 가능합니다.</div>
              <div class="log-item">정기 모니터링 사업의 빨간 점은 신규공고와 매칭된 정기지원 사업을 의미합니다.</div>
            </div>
          </div>
        </div>
      `;

      setNoticeList(notices);
      renderRegularCardsPaged();
    }

    function renderRegularCardsPaged() {
  const container = document.getElementById("regularCardsArea");

  if (!container) return;

  if (!regularCardsAll || regularCardsAll.length === 0) {
    container.innerHTML = `
      <div class="empty-box">정기지원(수정금지) 시트에 등록된 사업이 없습니다.</div>
    `;
    return;
  }

  const totalPages = Math.ceil(regularCardsAll.length / REGULAR_PAGE_SIZE);
  const startIndex = (regularPage - 1) * REGULAR_PAGE_SIZE;
  const endIndex = startIndex + REGULAR_PAGE_SIZE;
  const pageItems = regularCardsAll.slice(startIndex, endIndex);

  const cardsHtml = pageItems.map(card => `
    <div class="keyword-card" onclick="filterByRegularKeyword('${escapeJs(card.대표공고명)}', '${escapeJs(card.키워드패턴)}')">
      <div class="keyword-head">
        <div class="keyword-name">${escapeHtml(getText(card.대표공고명))}</div>
        <span class="dot ${card.등록여부 === "Y" ? "matched" : "unmatched"}"></span>
      </div>

      <div class="keyword-status">
        부처: ${escapeHtml(getText(card.부처))}<br>
        매칭 공고: ${escapeHtml(card.매칭건수 || 0)}건
      </div>
    </div>
  `).join("");

  container.innerHTML = `
    <div class="regular-card-wrap">
      <button 
        class="regular-arrow-btn"
        onclick="moveRegularPage(-1)"
        ${regularPage <= 1 ? "disabled" : ""}
      >
        ‹
      </button>

      <div class="keyword-cards">
  ${cardsHtml}
</div>

      <button 
        class="regular-arrow-btn"
        onclick="moveRegularPage(1)"
        ${regularPage >= totalPages ? "disabled" : ""}
      >
        ›
      </button>
    </div>

    <div class="regular-page-info">
      ${regularPage} / ${totalPages}
    </div>
  `;
}

    function moveRegularPage(direction) {
      const totalPages = Math.max(1, Math.ceil(regularCardsAll.length / REGULAR_PAGE_SIZE));

      regularPage += direction;

      if (regularPage < 1) regularPage = 1;
      if (regularPage > totalPages) regularPage = totalPages;

      renderRegularCardsPaged();
    }

    function renderNoticeRows(notices) {
      if (!notices || notices.length === 0) {
        return `
          <tr>
            <td colspan="8" style="text-align:center; color:#64748b; padding:30px;">
              표시할 공고가 없습니다.
            </td>
          </tr>
        `;
      }

      return notices.map(n => {
        const grade = escapeHtml(n.적합도등급 || "D");
        const progressStatus = normalizeStatus(n.상태 || n.진행상태);
        const applyStatus = n.접수상태표시 || n.접수상태 || "-";
        const applyStatusClass = getApplyStatusClass(applyStatus);
        const noticeId = escapeHtml(n.공고ID || "");

        return `
          <tr class="notice-row" data-notice-id="${noticeId}" onclick="goDetail(this.dataset.noticeId)">
            <td class="col-grade">
              <span class="grade-badge grade-${grade}">${grade}</span>
            </td>

            <td class="col-score">
              ${escapeHtml(getText(n.적합도점수))}
            </td>

            <td class="col-status">
              <span class="status-badge">${escapeHtml(progressStatus)}</span>
            </td>

            <td class="col-apply-status">
              <span class="apply-status-badge ${applyStatusClass}">
                ${escapeHtml(getText(applyStatus))}
              </span>
            </td>

            <td class="col-title">
              <b>${escapeHtml(getText(n.공고명))}</b>
            </td>

            <td class="col-ministry">
              ${escapeHtml(getText(n.소관부처))}
            </td>

            <td class="col-date">
              ${escapeHtml(getText(n.공고일))}
            </td>

            <td class="col-period">
              ${escapeHtml(getText(n.신청기간))}
            </td>
          </tr>
        `;
      }).join("");
    }

    function setNoticeList(notices) {
      CURRENT_NOTICE_LIST = sortNotices(notices || []);
      CURRENT_PAGE = 1;
      renderCurrentPage();
    }

    function renderCurrentPage() {
      const total = CURRENT_NOTICE_LIST.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

      if (CURRENT_PAGE < 1) CURRENT_PAGE = 1;
      if (CURRENT_PAGE > totalPages) CURRENT_PAGE = totalPages;

      const start = (CURRENT_PAGE - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageItems = CURRENT_NOTICE_LIST.slice(start, end);

      const tbody = document.getElementById("noticeTableBody");
      if (tbody) {
        tbody.innerHTML = renderNoticeRows(pageItems);
      }

      const visibleCount = document.getElementById("visibleCount");
      if (visibleCount) {
        visibleCount.textContent = total;
      }

      const pageInfo = document.getElementById("pageInfo");
      if (pageInfo) {
        pageInfo.textContent = `${CURRENT_PAGE} / ${totalPages}`;
      }

      const prevBtn = document.getElementById("prevPageBtn");
      const nextBtn = document.getElementById("nextPageBtn");

      if (prevBtn) {
        prevBtn.disabled = CURRENT_PAGE <= 1;
      }

      if (nextBtn) {
        nextBtn.disabled = CURRENT_PAGE >= totalPages;
      }
    }

    function changePage(direction) {
      CURRENT_PAGE += direction;
      renderCurrentPage();
    }

    function applyFilter() {
      const notices = window.__ALL_NOTICES__ || [];

      const region = document.getElementById("regionFilter").value;
      const ministry = document.getElementById("ministryFilter").value;
      const status = document.getElementById("statusFilter").value;
      const grade = document.getElementById("gradeFilter").value;

      const filtered = notices.filter(n => {
        const title = String(n.공고명 || "");
        const ministryText = String(n.소관부처 || "");
        const agencyText = String(n.수행기관 || "");
        const targetText = String(n.지원대상 || "");
        const contentText = String(n.지원내용 || "");
        const statusText = normalizeStatus(n.진행상태 || n.상태);
        const gradeText = String(n.적합도등급 || "");

        const regionSearchText = [
          title,
          ministryText,
          agencyText,
          targetText,
          contentText
        ].join(" ");

        if (region && !regionSearchText.includes(region)) return false;
        if (ministry && !ministryText.includes(ministry)) return false;
        if (status && statusText !== status) return false;
        if (grade && gradeText !== grade) return false;

        return true;
      });

      setNoticeList(filtered);
    }

    function resetFilter() {
      const notices = window.__ALL_NOTICES__ || [];

      const regionEl = document.getElementById("regionFilter");
      const ministryEl = document.getElementById("ministryFilter");
      const statusEl = document.getElementById("statusFilter");
      const gradeEl = document.getElementById("gradeFilter");

      if (regionEl) regionEl.value = "";
      if (ministryEl) ministryEl.value = "";
      if (statusEl) statusEl.value = "";
      if (gradeEl) gradeEl.value = "";

      CURRENT_SORT = "score_desc";

      setNoticeList(notices);
    }

    function filterByRegularKeyword(title, pattern) {
      const notices = window.__ALL_NOTICES__ || [];

      const keywordText = String(pattern || title || "");
      const keywords = keywordText
        .split("|")
        .map(v => v.trim())
        .filter(Boolean);

      const filtered = notices.filter(n => {
        const targetText = [
          n.공고명,
          n.소관부처,
          n.수행기관,
          n.지원대상,
          n.지원내용,
          n.매칭키워드,
          n.정기공고그룹,
          n.첨부파일,
          n.비고
        ].join(" ");

        if (title && String(n.공고명 || "").includes(title)) return true;

        return keywords.some(k => k && targetText.includes(k));
      });

      setNoticeList(filtered);
    }

    function renderDetail(data) {
      document.getElementById("pageTitle").textContent = "고객지원사업 - 신규지원사업 공고 상세";

      if (!data) {
        document.getElementById("app").className = "";
        document.getElementById("app").innerHTML = `
          <div class="empty-box">공고를 찾을 수 없습니다.</div>
        `;
        return;
      }

      CURRENT_DETAIL_NOTICE = data;

      const matchKeywords = data.매칭키워드 || "매칭 키워드 없음";
      const grade = data.적합도등급 || "-";
      const score = data.적합도점수 || "-";

      const noticeDocumentAttachment = getNoticeDocumentAttachment(data);

      const originButton = data.상세링크
        ? `<button class="origin-btn" onclick="window.open('${escapeJs(data.상세링크)}', '_blank')">
            원본 공고문 바로 보기 ↗
          </button>`
        : `<button class="origin-btn" disabled>
            원본 링크 없음
          </button>`;

      const downloadButton = noticeDocumentAttachment.name
        ? `<button
              class="${isValidAttachmentUrl(noticeDocumentAttachment.url) ? "download-origin-btn" : "download-origin-btn disabled"}"
              onclick="downloadAttachment('${escapeJs(noticeDocumentAttachment.url)}', '${escapeJs(noticeDocumentAttachment.name)}')"
            >
              공고문 다운로드
          </button>`
        : `<button
              class="download-origin-btn disabled"
              onclick="downloadAttachment('', '')"
            >
              공고문 다운로드
          </button>`;

      const driveSaveButton = hasValidNoticeDocumentAttachmentUrl(data.첨부파일)
        ? `<button
              id="driveSaveBtn"
              class="drive-save-btn"
              onclick="saveAttachmentsToDrive()"
            >
              공고문 Drive 저장
          </button>`
        : `<button
              id="driveSaveBtn"
              class="drive-save-btn disabled"
              onclick="saveAttachmentsToDrive()"
            >
              공고문 Drive 저장
          </button>`;

      const attachmentBox = renderAttachmentBox(data.첨부파일);

      document.getElementById("app").className = "";
      document.getElementById("app").innerHTML = `
        <div class="top-card">
          <button class="back-btn" onclick="goList()">← 사업 목록</button>

          <div>
            <span class="badge">${escapeHtml(getText(data.출처))}</span>
            <span class="badge gray">${escapeHtml(getText(data.소관부처))}</span>
          </div>

          <div class="notice-title">${escapeHtml(getText(data.공고명))}</div>

          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${originButton}
            ${downloadButton}
            ${driveSaveButton}
          </div>
        </div>

        <div class="ai-box">
          <div class="ai-title">✦ AI 적합도 분석</div>

          <div>
            <b>적합도 등급:</b> ${escapeHtml(getText(grade))}
            &nbsp;&nbsp; <b>적합도 점수:</b> ${escapeHtml(getText(score))}점
          </div>

          <div style="margin-top:8px;">
            <b>매칭 키워드:</b> ${escapeHtml(getText(matchKeywords))}
          </div>

          <div style="margin-top:8px;">
            <b>정기공고 여부:</b> ${escapeHtml(getText(data.정기공고여부 || "N"))}
          </div>
        </div>

        <div class="content-grid">
          <div class="info-card">
            <div class="section-title">핵심 요약 정보</div>

            <div class="row">
              <div class="label">공고일</div>
              <div class="value">${escapeHtml(getText(data.공고일))}</div>
            </div>

            <div class="row">
              <div class="label">마감일</div>
              <div class="value">${escapeHtml(getText(data.마감일))}</div>
            </div>

            <div class="row">
              <div class="label">접수 기간</div>
              <div class="value">${escapeHtml(getText(data.신청기간))}</div>
            </div>

            <div class="row">
              <div class="label">접수 상태</div>
              <div class="value">${escapeHtml(getText(data.접수상태표시 || data.접수상태))}</div>
            </div>

            <div class="row">
              <div class="label">진행 상태</div>
              <div class="value">${escapeHtml(getText(data.진행상태))}</div>
            </div>

            <div class="row">
              <div class="label">수행기관</div>
              <div class="value">${escapeHtml(getText(data.수행기관))}</div>
            </div>

            <div class="row">
              <div class="label">지원 대상</div>
              <div class="value">${escapeHtml(getText(data.지원대상))}</div>
            </div>

            <div class="row">
              <div class="label">지원 내용</div>
              <div class="value">${escapeHtml(getText(data.지원내용))}</div>
            </div>

            <div class="row">
              <div class="label">접수 방법</div>
              <div class="value">${escapeHtml(getText(data.접수처 || "공고문 확인"))}</div>
            </div>

            <div class="row">
              <div class="label">문의처</div>
              <div class="value">${escapeHtml(getText(data.문의처))}</div>
            </div>
          </div>

          <div class="status-card">
            <div class="section-title">진행 상태 변경</div>

            <div style="font-size:13px; color:#64748b; line-height:1.5; margin-bottom:14px;">
              캘린더 등록, 미진행, 진행확정 중 하나를 선택하면 공고의 진행상태가 변경됩니다.
            </div>

            <button class="status-btn review" onclick="changeStatus('검토요청')">캘린더 등록</button>
            <button class="status-btn drop" onclick="changeStatus('미진행')">미진행</button>
            <button class="status-btn confirm" onclick="changeStatus('진행확정')">진행확정</button>
            <button class="status-btn none" onclick="changeStatus('상태 미선택')">상태 미선택</button>
          </div>
        </div>

        ${attachmentBox}

        ${renderNoticePreviewBox(data)}
      `;
    }

    function changeStatus(status) {
      const currentNoticeId =
        (CURRENT_DETAIL_NOTICE && CURRENT_DETAIL_NOTICE["공고ID"])
          ? CURRENT_DETAIL_NOTICE["공고ID"]
          : NOTICE_ID;

      if (!currentNoticeId) {
        alert("공고ID가 없어 상태를 변경할 수 없습니다.");
        return;
      }

      google.script.run
        .withSuccessHandler(result => {
          const displayStatus = status === "검토요청" ? "캘린더 등록" : status;
          let message = "'" + displayStatus + "' 처리가 완료되었습니다.";

          if (status === "검토요청" || status === "진행확정") {
            if (result && result.calendar) {
              if (result.calendar.created) {
                message += "\n\n구글 캘린더에 접수기간 일정이 등록되었습니다.";
              } else {
                message += "\n\n구글 캘린더에 이미 등록된 일정이 있어 중복 등록하지 않았습니다.";
              }
            } else {
              message += "\n\n캘린더 등록 결과를 확인하지 못했습니다.";
            }
          }

          alert(message);

          google.script.run
            .withSuccessHandler(data => {
              LAST_LIST_PAYLOAD = null;
              renderDetail(data);
            })
            .withFailureHandler(err => {
              renderError(err.message);
            })
            .getNoticeDetail(currentNoticeId);
        })
        .withFailureHandler(err => {
          alert("상태 변경 실패: " + err.message);
        })
        .updateNoticeStatus(currentNoticeId, status, "박나연");
    }

    function renderError(message) {
      document.getElementById("app").className = "";
      document.getElementById("app").innerHTML = `
        <div class="empty-box">
          불러오기 실패<br><br>
          ${escapeHtml(message)}
        </div>
      `;
    }

    function getNoticeIdFromUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id || id === "undefined" || id === "null") {
      return "";
    }

    return id.trim();
  } catch (e) {
    return "";
  }
}

window.addEventListener("popstate", function(event) {
    const noticeId = getNoticeIdFromUrl();

    document.getElementById("app").className = "loading";

    if (noticeId) {
      document.getElementById("app").innerHTML = "상세 정보를 불러오는 중...";

      google.script.run
        .withSuccessHandler(data => {
          if (!data) {
            renderError("공고를 찾을 수 없습니다.");
            return;
          }

          renderDetail(data);
        })
        .withFailureHandler(err => {
          renderError(err.message);
        })
        .getNoticeDetail(noticeId);

      return;
    }

    document.getElementById("app").innerHTML = "불러오는 중...";

    if (LAST_LIST_PAYLOAD) {
      renderList(LAST_LIST_PAYLOAD);
      return;
    }

    google.script.run
      .withSuccessHandler(renderList)
      .withFailureHandler(err => {
        renderError(err.message);
      })
      .getNoticeList();
  });

    const INITIAL_NOTICE_ID = getNoticeIdFromUrl() || String(NOTICE_ID || "").trim();

    if (INITIAL_NOTICE_ID && INITIAL_NOTICE_ID !== "undefined" && INITIAL_NOTICE_ID !== "null") {
      google.script.run
        .withSuccessHandler(renderDetail)
        .withFailureHandler(err => {
          renderError(err.message);
        })
        .getNoticeDetail(INITIAL_NOTICE_ID);
    } else {
      google.script.run
        .withSuccessHandler(renderList)
        .withFailureHandler(err => {
          renderError(err.message);
        })
        .getNoticeList();
    }
  </script>
</body>
</html>
